# CI for JavaScript: runs on every push and pull request.
# Flow: get code -> set up Node -> install from lockfile -> lint -> format check ->
# tests with coverage (80% floor set in the test tool's config) -> dependency scan
# (fails on any vulnerability).
name: CI (JavaScript)

on:
  push:
  pull_request:

permissions:
  contents: read   # read-only: CI never needs to write to the repo

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (exact versions from lockfile)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Tests with coverage (80% floor)
        run: npm run test:coverage

      - name: Dependency scan (fails on any vulnerability)
        run: npm audit --audit-level=low
